# =============================================================================
# ArkNet Fleet System - Plugin-Based Configuration
# =============================================================================
# Each service/simulator is configured as a "plugin" with its own section
# This makes the system truly modular and extensible

[launcher]
# Global launcher settings
api_port = 7000
cors_origins = http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001

# Startup timing (global defaults)
startup_wait_default = 10
strapi_startup_wait = 15
simulator_delay = 5

# =============================================================================
# SERVICE PLUGINS
# =============================================================================

[strapi]
# Strapi CMS - Foundation service
enabled = true
port = 1337
url = http://localhost:1337
health_url = http://localhost:1337/_health
spawn_console = true
startup_wait = 15
category = foundation
display_name = Strapi CMS
description = Content management system and API backend
icon = CMS
dependencies =
exe_cmd = npm run develop --prefix arknet_fleet_manager/arknet-fleet-api

[gpscentcom]
# GPSCentCom Server - Core service
enabled = true
port = 5000
http_url = http://localhost:5000
ws_url = ws://localhost:5000
health_url = http://localhost:5000/health
spawn_console = true
startup_wait = 10
category = core
display_name = GPSCentCom Server
description = GPS coordinate communication and tracking server
icon = GPS
dependencies = strapi
exe_cmd = python -m gpscentcom_server.server_main

[vehicle_simulator]
# Vehicle Simulator - Simulator service
enabled = true
port =
health_url = 
spawn_console = true
startup_wait = 0
category = simulator
display_name = Vehicle Simulator
description = Transit vehicle movement and behavior simulation
icon = 🚐
dependencies = strapi,gpscentcom
exe_cmd = python -m arknet_transit_simulator --mode depot
# Vehicle Simulator specific settings (runtime mode)
mode = depot

[redis]
# Redis key-value store used for caching (optional)
# Provide either `exe_path` pointing to a redis-server executable, or `exe_cmd` for a shell command,
# otherwise the launcher will assume `redis-server` is available on PATH.
enabled = true
port = 6379
spawn_console = false
startup_wait = 2
category = core
display_name = Redis
description = Local Redis server for caching and dev workflows
icon = 🧰
exe_cmd = redis-server --protected-mode no
# Examples:
# exe_path = C:/Program Files/Redis/redis-server.exe

[nextjs_admin]
# Next.js Admin Portal - Dashboard UI
enabled = true
port = 3000
url = http://localhost:3000
health_url = http://localhost:3000/api/health
spawn_console = true
startup_wait = 5
category = dashboard
display_name = Next.js Admin Portal
description = Web dashboard for service management and analytics
icon = 🖥️
dependencies = strapi,gpscentcom
exe_cmd = npm run dev --prefix arknet_fleet_manager/dashboard

[infrastructure]
# Global infrastructure settings
database_host = localhost
database_port = 5432

# Service URLs (for backward compatibility with existing services)
strapi_url = http://localhost:1337
geospatial_url = http://localhost:6000
commuter_service_url = http://localhost:4000
gpscentcom_http_url = http://localhost:5000
gpscentcom_ws_url = ws://localhost:5000

[logging]
# Global logging configuration
level = INFO
format = %(asctime)s - %(name)s - %(levelname)s - %(message)s
