<!DOCTYPE html>
<html>
<head>
  <title>Auth Test - Valid Login</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 50px auto;
      padding: 20px;
    }
    .status {
      padding: 10px;
      margin: 10px 0;
      border-radius: 5px;
    }
    .success { background-color: #d4edda; color: #155724; }
    .error { background-color: #f8d7da; color: #721c24; }
    .info { background-color: #d1ecf1; color: #0c5460; }
  </style>
</head>
<body>
  <h1>Authentication Test - Valid Login</h1>
  <div id="status" class="status info">Logging in...</div>
  <div id="details"></div>

  <script>
    let eventSource = null;

    async function login() {
      const statusDiv = document.getElementById('status');
      const detailsDiv = document.getElementById('details');
      
      try {
        statusDiv.textContent = 'Sending login request...';
        
        const response = await fetch('http://localhost:7000/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include', // Important: include cookies
          body: JSON.stringify({ 
            username: 'fleet_manager', 
            password: 'Ga25w123' 
          })
        });

        if (response.ok) {
          const data = await response.json();
          statusDiv.className = 'status success';
          statusDiv.textContent = '✓ Login successful! Connecting to telemetry...';
          detailsDiv.innerHTML = `
            <p><strong>User:</strong> ${data.user?.username || 'N/A'}</p>
            <p><strong>JWT Cookie:</strong> Set (httpOnly)</p>
            <h3>Telemetry Stream:</h3>
            <div id="telemetry" style="max-height: 400px; overflow-y: auto; background: #f5f5f5; padding: 10px; border-radius: 5px; font-family: monospace; font-size: 12px;"></div>
          `;
          
          connectTelemetry();
        } else {
          const errorText = await response.text();
          statusDiv.className = 'status error';
          statusDiv.textContent = '✗ Login failed';
          detailsDiv.innerHTML = `<p><strong>Error:</strong> ${response.status} - ${errorText}</p>`;
        }
      } catch (error) {
        statusDiv.className = 'status error';
        statusDiv.textContent = '✗ Connection error';
        detailsDiv.innerHTML = `<p><strong>Error:</strong> ${error.message}</p>`;
      }
    }

    function connectTelemetry() {
      eventSource = new EventSource('http://localhost:5000/client/sse', {
        withCredentials: true
      });

      const telemetryDiv = document.getElementById('telemetry');

      eventSource.onopen = () => {
        telemetryDiv.innerHTML += '<div style="color: green;">✓ Connected to telemetry stream</div>';
      };

      eventSource.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          const timestamp = new Date().toLocaleTimeString();
          telemetryDiv.innerHTML += `<div style="margin: 5px 0; border-bottom: 1px solid #ddd; padding: 5px 0;">
            <strong>[${timestamp}]</strong> ${JSON.stringify(data, null, 2)}
          </div>`;
          telemetryDiv.scrollTop = telemetryDiv.scrollHeight;
        } catch (e) {
          console.error('Error parsing telemetry:', e);
        }
      };

      eventSource.onerror = (error) => {
        console.error('SSE Error:', error);
        telemetryDiv.innerHTML += '<div style="color: red;">✗ Connection error or closed</div>';
      };
    }

    // Cleanup on page unload
    window.addEventListener('beforeunload', () => {
      if (eventSource) {
        eventSource.close();
      }
    });

    // Auto-login on page load
    login();
  </script>
</body>
</html>
